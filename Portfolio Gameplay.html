<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portfolio Gameplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: papel de plano (blueprint). Hero con nombre grande y un controlador de personaje jugable con HUD de depuración;
   proyectos como paneles con cabecera de color por motor (Unreal, Unity, multi-motor). */
:root {
  --bg: #E8EEF7;
  --surface: #F5F8FD;
  --surface2: #DCE5F2;
  --ink: #0F2240;
  --muted: #4B5F7E;
  --line: #B4C4DC;
  --grid: rgba(15, 34, 64, 0.07);
  --accent: #C2410C;
  --accent-ink: #FFFFFF;
  --data: #0B6E80;
  --c-ue: #B42332;
  --c-sys: #1D5FBF;
  --c-ai: #2B7A3E;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B2140;
    --surface: #0F2A4F;
    --surface2: #143562;
    --ink: #E7F0FF;
    --muted: #9DB5D6;
    --line: #2A4B78;
    --grid: rgba(150, 195, 255, 0.07);
    --accent: #FFB224;
    --accent-ink: #1A1100;
    --data: #5FE0E6;
    --c-ue: #E5484D;
    --c-sys: #4C8DF6;
    --c-ai: #46B36B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B2140;
  --surface: #0F2A4F;
  --surface2: #143562;
  --ink: #E7F0FF;
  --muted: #9DB5D6;
  --line: #2A4B78;
  --grid: rgba(150, 195, 255, 0.07);
  --accent: #FFB224;
  --accent-ink: #1A1100;
  --data: #5FE0E6;
  --c-ue: #E5484D;
  --c-sys: #4C8DF6;
  --c-ai: #46B36B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  color: var(--ink);
  font: 16px/1.6 var(--font-body);
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 0.95; letter-spacing: 0.005em; }
.mono { font-family: var(--font-mono); }
.label { font: 500 12px/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.brand { font: 800 22px/1 var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; text-decoration: none; }
.brand span { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { font: 500 13px/1 var(--font-mono); text-decoration: none; padding: 9px 12px; border: 1px solid transparent; color: var(--muted); }
nav a:hover { color: var(--ink); border-color: var(--line); background: var(--surface); }

/* hero */
.hero { padding-block: 56px 48px; }
.exec { display: inline-flex; align-items: center; gap: 10px; font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.06em; }
.exec i { width: 0; height: 0; border-left: 9px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; display: inline-block; }
.hero h1 { font-size: clamp(3.4rem, 11vw, 8rem); font-weight: 900; text-transform: uppercase; margin-top: 18px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 26px; }
.tagline { font-size: clamp(1.05rem, 2.2vw, 1.3rem); max-width: 34em; margin: 0; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.btn {
  font: 600 14px/1 var(--font-body); text-decoration: none; padding: 14px 20px;
  border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer;
}
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }

/* playground */
.pg { border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.pg-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.states { display: flex; gap: 6px; flex-wrap: wrap; }
.st { font: 500 12px/1 var(--font-mono); padding: 6px 9px; border: 1px solid var(--line); color: var(--muted); }
.st.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.readout { display: flex; gap: 14px; flex-wrap: wrap; font: 400 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.readout b { color: var(--data); font-weight: 500; display: inline-block; min-width: 4.2ch; text-align: right; }
#pg { display: block; width: 100%; height: 300px; touch-action: none; cursor: crosshair; }
#pg:focus-visible { outline-offset: -3px; }
.pad { display: none; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.pad button { flex: 1; font: 600 18px/1 var(--font-body); padding: 14px 0; background: var(--surface2); color: var(--ink); border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
.pad button:active { background: var(--accent); color: var(--accent-ink); }
@media (pointer: coarse) { .pad { display: flex; } }

/* sections */
section { padding-block: 48px; }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.sec-head h2 { font-size: clamp(2.4rem, 6vw, 3.8rem); font-weight: 800; text-transform: uppercase; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 500 13px/1 var(--font-mono); padding: 9px 13px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* project nodes */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px; align-items: start; }
.node { background: var(--surface); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; box-shadow: 0 10px 24px -16px rgba(0, 0, 0, 0.5); }
.node-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; color: #fff; background: var(--cat); }
.node-h h3 { font-size: 1.45rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
.node-h .cat { font: 500 11px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.92; white-space: nowrap; }
.node[data-cat="ue"] { --cat: var(--c-ue); }
.node[data-cat="unity"] { --cat: var(--c-sys); }
.node[data-cat="multi"] { --cat: var(--c-ai); }
.thumb { display: block; width: 100%; aspect-ratio: 16 / 7; background: var(--bg); border-bottom: 1px solid var(--line); object-fit: cover; }
.tn { fill: var(--surface2); stroke: var(--line); stroke-width: 1; }
.tw { fill: none; stroke: var(--cat); stroke-width: 2; opacity: 0.85; }
.th { fill: var(--cat); }
.pin-dot { fill: var(--surface); stroke: var(--cat); stroke-width: 2; }
.node-b { padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.node-b p { margin: 0; font-size: 15px; }
.pins { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.pins li { display: flex; align-items: center; gap: 10px; font: 400 13px/1.3 var(--font-mono); min-width: 0; }
.pins li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--cat); flex: none; }
.pins span { color: var(--muted); flex: none; min-width: 6ch; }
.pins b { font-weight: 500; margin-left: auto; text-align: right; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 400 12px/1 var(--font-mono); padding: 6px 8px; border: 1px solid var(--line); color: var(--muted); }
.more { margin-top: auto; font: 600 13px/1 var(--font-body); background: none; border: 0; border-top: 1px solid var(--line); padding: 14px; color: var(--ink); text-align: left; cursor: pointer; display: flex; justify-content: space-between; }
.more:hover { background: var(--surface2); }
.more::after { content: "+"; font-family: var(--font-mono); }
.more[aria-expanded="true"]::after { content: "–"; }
.detail { padding: 0 14px 16px; border-top: 1px dashed var(--line); }
.detail ul { margin: 14px 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font: 500 13px/1 var(--font-mono); padding: 9px 12px; border: 1px solid var(--cat); color: var(--ink); text-decoration: none; }
.links a:hover { background: var(--cat); color: #fff; }
.badge { font: 500 10px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 6px; border: 1px dashed currentColor; opacity: 0.85; }

/* about + skills */
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; }
.about p { margin: 0 0 1em; max-width: 36em; font-size: 1.05rem; }
.skills { display: grid; gap: 22px; min-width: 0; }
.sk h3 { font-size: 1.1rem; font-family: var(--font-mono); font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 10px; line-height: 1.2; }
.sk .tags .tag { font-size: 13px; padding: 8px 10px; color: var(--ink); background: var(--surface); }

/* contact */
.contact { border: 1px solid var(--line); background: var(--surface); padding: 32px 22px; display: grid; gap: 22px; }
.contact h2 { font-size: clamp(2.6rem, 8vw, 5rem); font-weight: 900; text-transform: uppercase; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.mail code { font: 500 clamp(15px, 3.4vw, 20px)/1.2 var(--font-mono); color: var(--data); padding: 10px 12px; border: 1px dashed var(--line); overflow-wrap: anywhere; user-select: all; }
footer { padding-block: 28px 56px; color: var(--muted); font: 400 12px/1.6 var(--font-mono); }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; border-top: 1px solid var(--line); padding-top: 20px; }

@media (min-width: 900px) {
  .hero-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; align-items: start; }
  .two { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 56px; }
  .contact { padding: 48px; }
}
@media (max-width: 560px) {
  nav a { padding: 8px 8px; font-size: 12px; }
  .top .wrap { padding-block: 8px; }
  #pg { height: 260px; }
}
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#inicio" id="brand">Tu <span>Nombre</span></a>
    <nav aria-label="Secciones">
      <a href="#proyectos">Proyectos</a>
      <a href="#sobre-mi">Sobre mí</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap hero" id="inicio">
    <span class="exec"><i></i>Gameplay programmer · Unreal · Unity</span>
    <h1 id="name">Tu <em>Nombre</em></h1>
    <div class="hero-grid">
      <div>
        <p class="tagline" id="tagline"></p>
        <div class="cta">
          <a class="btn primary" href="#proyectos">Ver proyectos</a>
          <a class="btn" href="#contacto">Contactar</a>
        </div>
      </div>
      <div class="pg" id="playground">
        <div class="pg-bar">
          <div class="states" aria-label="Estado del personaje">
            <span class="st" data-s="IDLE">Idle</span>

          </div>

        <canvas id="pg" tabindex="0" aria-label="Controlador de personaje jugable. Muévete con A y D o las flechas, salta con espacio."></canvas>
        <div class="pad">
          <button id="b-left" aria-label="Izquierda">◀</button>
          <button id="b-jump" aria-label="Saltar">Saltar</button>
          <button id="b-right" aria-label="Derecha">▶</button>
        </div>
      </div>
    </div>
  </div>

  <section id="proyectos">
    <div class="wrap">
      <div class="sec-head">
        <h2>Proyectos</h2>
        <div class="filters" id="filters" role="group" aria-label="Filtrar proyectos"></div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="sobre-mi">
    <div class="wrap two">
      <div class="about">
        <div class="sec-head"><h2>Sobre mí</h2></div>
        <div id="about"></div>
      </div>
      <div>
        <div class="sec-head"><h2>Herramientas</h2></div>
        <div class="skills" id="skills"></div>
      </div>
    </div>
  </section>

  <section id="contacto">
    <div class="wrap">
      <div class="contact">
        <span class="label">Disponible para proyectos y colaboraciones</span>
        <h2>Hablemos</h2>
        <div class="mail">
          <code id="email"></code>
          <button class="btn" id="copy" type="button">Copiar</button>
        </div>
        <div class="links" id="socials"></div>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="foot-name"></span>
    <span>Gameplay programming · Unreal · Unity</span>
  </div>
</footer>

<script>
/* ===== CONFIG: edita aquí tus datos ===== */
const CONFIG = {
  name: ["Tu", "Nombre"],            // [normal, resaltado]
  tagline: "Convierto ideas de diseño en mecánicas que se sienten bien al jugarlas. Programo gameplay tanto en Unreal Engine como en Unity.",
  about: [
    "Soy gameplay programmer y me interesa todo lo que ocurre entre que el jugador pulsa un botón y la pantalla responde: controles, estados, cámara, combate e IA.",
    "Trabajo tanto en Unreal Engine como en Unity, y me gusta dejar los sistemas ordenados para que el equipo de diseño pueda tocarlos sin miedo."
  ],
  email: "tu@email.com",
  socials: [
    { label: "GitHub", url: "https://github.com" },
    { label: "LinkedIn", url: "https://www.linkedin.com" },
    { label: "itch.io", url: "https://itch.io" },
    { label: "YouTube", url: "https://www.youtube.com" }
  ],
  skills: [
    { group: "Motores", items: ["Unreal Engine 5.6", "Blueprints", "Unity"] },
    { group: "Gameplay", items: ["Controladores de personaje", "Máquinas de estados", "Sistemas de combate", "IA de enemigos", "Cámara", "Input"] },
    { group: "Flujo de trabajo", items: ["Git", "Prototipado rápido", "Depuración en juego"] }
  ],
  /* cat: "ue" (Unreal) | "unity" (Unity) | "multi" (varios motores). Quita "placeholder: true" cuando pongas tu proyecto real.
     Añade image: "data:image/..." o una ruta para usar tu captura en vez del esquema de nodos. */
  projects: [
    {
      id: "ue56-proyecto", cat: "ue", catLabel: "Unreal", title: "Proyecto UE 5.6", placeholder: true,
      summary: "Proyecto complejo construido con Blueprints, con varios sistemas de gameplay conectados entre sí.",
      engine: "Unreal Engine 5.6", role: "Gameplay Programmer", year: "2026",
      tags: ["Blueprints", "UE 5.6", "Gameplay"],
      details: [
        "Cuenta qué es el juego y cuál era tu responsabilidad.",
        "Describe el sistema más difícil que resolviste y cómo lo hiciste.",
        "Añade el resultado: duración de la partida, equipo, plataforma."
      ],
      links: [{ label: "Vídeo", url: "https://www.youtube.com" }]
    },
    {
      id: "controlador", cat: "multi", catLabel: "Multi-motor", title: "Controlador de personaje", placeholder: true,
      summary: "Movimiento con coyote time, salto con buffer y salto variable. Pruébalo arriba, en el inicio de la página.",
      engine: "Unreal y Unity", role: "Gameplay Programmer", year: "2026",
      tags: ["Movimiento", "Estados", "Game feel"],
      details: [
        "Explica los parámetros que se pueden ajustar desde el editor.",
        "Cuenta cómo separaste el input de los estados del personaje."
      ],
      links: [{ label: "Código", url: "https://github.com" }]
    },
    {
      id: "combate", cat: "unity", catLabel: "Unity", title: "Sistema de combate", placeholder: true,
      summary: "Ataques encadenables, ventanas de cancelación y daño con feedback claro para el jugador.",
      engine: "Unity", role: "Gameplay Programmer", year: "2026",
      tags: ["Combos", "Hitboxes", "Animación"],
      details: [
        "Resume cómo se define un ataque nuevo sin tocar el código base.",
        "Incluye un GIF corto de un combo."
      ],
      links: [{ label: "Vídeo", url: "https://www.youtube.com" }]
    },
    {
      id: "ia", cat: "ue", catLabel: "Unreal", title: "IA de enemigos", placeholder: true,
      summary: "Enemigos que patrullan, detectan al jugador y cambian de comportamiento según la situación.",
      engine: "Unreal Engine 5.6", role: "Gameplay Programmer", year: "2026",
      tags: ["Behavior Tree", "Percepción", "Estados"],
      details: [
        "Explica qué decisiones toma el enemigo y por qué.",
        "Añade cómo depuraste el comportamiento."
      ],
      links: [{ label: "Vídeo", url: "https://www.youtube.com" }]
    }
  ]
};

/* ===== helpers ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===== contenido ===== */
(function renderStatic() {
  const [a, b] = CONFIG.name;
  $("#name").innerHTML = esc(a) + " <em>" + esc(b) + "</em>";
  $("#brand").innerHTML = esc(a) + " <span>" + esc(b) + "</span>";
  $("#tagline").textContent = CONFIG.tagline;
  $("#about").innerHTML = CONFIG.about.map(p => "<p>" + esc(p) + "</p>").join("");
  $("#skills").innerHTML = CONFIG.skills.map(g =>
    '<div class="sk"><h3>' + esc(g.group) + '</h3><div class="tags">' +
    g.items.map(i => '<span class="tag">' + esc(i) + "</span>").join("") + "</div></div>").join("");
  $("#email").textContent = CONFIG.email;
  $("#socials").innerHTML = CONFIG.socials.map(s =>
    '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.label) + " ↗</a>").join("");
  $("#foot-name").textContent = "© " + new Date().getFullYear() + " " + a + " " + b;
  document.querySelectorAll(".contact .links a").forEach(l => l.style.setProperty("--cat", "var(--accent)"));
})();

/* copiar email */
$("#copy").addEventListener("click", async () => {
  const btn = $("#copy"), el = $("#email");
  try {
    await navigator.clipboard.writeText(CONFIG.email);
    btn.textContent = "Copiado";
  } catch (e) {
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    btn.textContent = "Selecciona y copia";
  }
  setTimeout(() => { btn.textContent = "Copiar"; }, 1800);
});

/* ===== proyectos ===== */
function seeded(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; };
}
function thumb(p) {
  if (p.image) return '<img class="thumb" src="' + esc(p.image) + '" alt="Captura de ' + esc(p.title) + '" loading="lazy">';
  const r = seeded(p.id), W = 320, H = 140, n = 4, nodes = [];
  for (let i = 0; i < n; i++) {
    const w = 62 + Math.round(r() * 18), h = 34 + Math.round(r() * 22);
    const x = 14 + i * ((W - 28 - 70) / (n - 1)), y = 14 + r() * (H - h - 28);
    nodes.push({ x, y, w, h });
  }
  let wires = "", boxes = "";
  nodes.forEach((a, i) => {
    boxes += '<rect class="tn" x="' + a.x + '" y="' + a.y + '" width="' + a.w + '" height="' + a.h + '"/>' +
      '<rect class="th" x="' + a.x + '" y="' + a.y + '" width="' + a.w + '" height="9"/>';
    const b = nodes[i + 1];
    if (b) {
      const x1 = a.x + a.w, y1 = a.y + a.h / 2 + 4, x2 = b.x, y2 = b.y + b.h / 2 + 4, dx = (x2 - x1) * 0.5;
      wires += '<path class="tw" d="M' + x1 + " " + y1 + " C" + (x1 + dx) + " " + y1 + " " + (x2 - dx) + " " + y2 + " " + x2 + " " + y2 + '"/>' +
        '<circle class="pin-dot" cx="' + x1 + '" cy="' + y1 + '" r="4"/><circle class="pin-dot" cx="' + x2 + '" cy="' + y2 + '" r="4"/>';
    }
  });
  return '<svg class="thumb" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Esquema de nodos de ' + esc(p.title) + '">' + wires + boxes + "</svg>";
}
function card(p) {
  const id = "d-" + p.id;
  return '<article class="node" data-cat="' + p.cat + '">' +
    '<div class="node-h"><h3>' + esc(p.title) + '</h3><span class="cat">' + esc(p.catLabel) + "</span></div>" +
    thumb(p) +
    '<div class="node-b"><p>' + esc(p.summary) + "</p>" +
    '<ul class="pins"><li><span>Motor</span><b>' + esc(p.engine) + "</b></li><li><span>Rol</span><b>" + esc(p.role) + "</b></li><li><span>Año</span><b>" + esc(p.year) + "</b></li></ul>" +
    '<div class="tags">' + p.tags.map(t => '<span class="tag">' + esc(t) + "</span>").join("") +
    (p.placeholder ? '<span class="badge" title="Sustituye este texto por tu proyecto real">Plantilla</span>' : "") + "</div></div>" +
    '<button class="more" type="button" aria-expanded="false" aria-controls="' + id + '">Detalles</button>' +
    '<div class="detail" id="' + id + '" hidden><ul>' + p.details.map(d => "<li>" + esc(d) + "</li>").join("") + "</ul>" +
    '<div class="links">' + p.links.map(l => '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + " ↗</a>").join("") + "</div></div>" +
    "</article>";
}
(function renderProjects() {
  const grid = $("#grid"), filters = $("#filters");
  const cats = [["all", "Todos"]];
  CONFIG.projects.forEach(p => { if (!cats.some(c => c[0] === p.cat)) cats.push([p.cat, p.catLabel]); });
  filters.innerHTML = cats.map((c, i) => '<button class="chip" type="button" data-f="' + c[0] + '" aria-pressed="' + (i === 0) + '">' + esc(c[1]) + "</button>").join("");
  function draw(f) { grid.innerHTML = CONFIG.projects.filter(p => f === "all" || p.cat === f).map(card).join(""); }
  draw("all");
  filters.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    filters.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    draw(b.dataset.f);
  });
  grid.addEventListener("click", e => {
    const b = e.target.closest(".more"); if (!b) return;
    const open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open));
    document.getElementById(b.getAttribute("aria-controls")).hidden = open;
  });
})();

/* ===== controlador de personaje jugable ===== */
(function playground() {
  const cv = $("#pg"), ctx = cv.getContext("2d");
  const H = () => cv.clientHeight;
  let W = 0, dpr = 1, plats = [], pal = null, frame = 0, running = false, last = 0, hudT = 0;
  const P = { x: 40, y: 0, w: 20, h: 32, vx: 0, vy: 0, grounded: false, coyote: 0, buffer: 0, state: "IDLE", face: 1 };
  const keys = { left: false, right: false, jump: false };
  const MAXV = 280, ACC = 1800, FRIC = 1500, GRAV = 1900, JUMP = 640, COYOTE = 0.1, BUFFER = 0.1;
  let trail = [], focused = false;

  function readPalette() {
    const s = getComputedStyle(document.documentElement), g = n => s.getPropertyValue(n).trim();
    pal = { ink: g("--ink"), muted: g("--muted"), line: g("--line"), accent: g("--accent"), data: g("--data"), surface2: g("--surface2"), surface: g("--surface") };
  }
  function layout() {
    const h = H(), gy = h - 30;
    plats = [
      { x: 0, y: gy, w: W, solid: true },
      { x: W * 0.10, y: gy - 78, w: Math.max(70, W * 0.2) },
      { x: W * 0.42, y: gy - 140, w: Math.max(70, W * 0.2) },
      { x: W * 0.72, y: gy - 78, w: Math.max(70, W * 0.2) }
    ];
    if (!P.y) P.y = gy - P.h;
  }
  function resize() {
    const r = cv.getBoundingClientRect();
    W = r.width; dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
    P.x = Math.min(P.x, W - P.w);
    if (P.y > H() - 30 - P.h) P.y = H() - 30 - P.h;
    draw();
  }
  new ResizeObserver(resize).observe(cv);

  function step(dt) {
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const air = P.grounded ? 1 : 0.65;
    if (dir) { P.vx += dir * ACC * air * dt; P.face = dir; }
    else if (P.vx) { const f = FRIC * air * dt; P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f; }
    P.vx = Math.max(-MAXV, Math.min(MAXV, P.vx));

    P.coyote = P.grounded ? COYOTE : Math.max(0, P.coyote - dt);
    P.buffer = Math.max(0, P.buffer - dt);
    if (P.buffer > 0 && P.coyote > 0) { P.vy = -JUMP; P.buffer = 0; P.coyote = 0; P.grounded = false; }
    const g = (!keys.jump && P.vy < 0) ? GRAV * 2.2 : GRAV;
    P.vy += g * dt;

    P.x += P.vx * dt;
    if (P.x < 0) { P.x = 0; P.vx = 0; }
    if (P.x > W - P.w) { P.x = W - P.w; P.vx = 0; }

    const prevBottom = P.y + P.h;
    P.y += P.vy * dt;
    const bottom = P.y + P.h;
    P.grounded = false;
    if (P.vy >= 0) {
      for (const pl of plats) {
        if (P.x + P.w > pl.x && P.x < pl.x + pl.w && prevBottom <= pl.y + 1 && bottom >= pl.y) {
          P.y = pl.y - P.h; P.vy = 0; P.grounded = true; break;
        }
      }
    }
    P.state = P.grounded ? (Math.abs(P.vx) > 20 ? "RUN" : "IDLE") : (P.vy < 0 ? "JUMP" : "FALL");
    trail.push({ x: P.x + P.w / 2, y: P.y + P.h / 2 });
    if (trail.length > 14) trail.shift();
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  }
  function draw() {
    if (!pal) readPalette();
    const h = H();
    ctx.clearRect(0, 0, W, h);
    // plataformas
    plats.forEach(pl => {
      ctx.fillStyle = pal.surface2; ctx.strokeStyle = pal.line; ctx.lineWidth = 1;
      const th = pl.solid ? 30 : 10;
      ctx.fillRect(pl.x, pl.y, pl.w, th); ctx.strokeRect(pl.x + 0.5, pl.y + 0.5, pl.w - 1, th - 1);
      ctx.fillStyle = pal.ink; ctx.fillRect(pl.x, pl.y, pl.w, 2);
    });
    // rastro
    trail.forEach((t, i) => {
      ctx.globalAlpha = (i / trail.length) * 0.35; ctx.fillStyle = pal.accent;
      ctx.beginPath(); ctx.arc(t.x, t.y, 3, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    // rayo de suelo
    ctx.strokeStyle = P.grounded ? pal.data : pal.muted; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(P.x + P.w / 2, P.y + P.h); ctx.lineTo(P.x + P.w / 2, P.y + P.h + 14); ctx.stroke(); ctx.setLineDash([]);
    // personaje
    ctx.fillStyle = pal.accent; rr(P.x, P.y, P.w, P.h, 9); ctx.fill();
    ctx.fillStyle = pal.surface; ctx.fillRect(P.x + P.w / 2 + P.face * 3 - 2, P.y + 8, 4, 4);
    // vector de velocidad
    if (Math.abs(P.vx) > 5 || Math.abs(P.vy) > 5) {
      const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
      ctx.strokeStyle = pal.data; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + P.vx * 0.12, cy + P.vy * 0.12); ctx.stroke();
    }
    // ayuda
    ctx.font = "500 11px 'IBM Plex Mono', ui-monospace, monospace"; ctx.fillStyle = pal.muted; ctx.textBaseline = "top";
    ctx.fillText(focused ? "A/D o ←/→ mover · Espacio saltar" : "Haz clic y juega · A/D o ←/→ · Espacio", 12, 12);
  }
  function hud() {
    $("#r-vx").textContent = Math.round(P.vx);
    $("#r-vy").textContent = Math.round(P.vy);
    $("#r-co").textContent = Math.round(P.coyote * 1000);
    document.querySelectorAll(".st").forEach(s => s.classList.toggle("on", s.dataset.s === P.state));
  }
  function loop(t) {
    if (!running) return;
    const dt = Math.min(0.033, (t - last) / 1000 || 0.016); last = t;
    step(dt);
    if (++frame % 30 === 0) readPalette();
    draw();
    hudT += dt; if (hudT > 0.08) { hudT = 0; hud(); }
    requestAnimationFrame(loop);
  }
  function start() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(loop); }
  function stop() { running = false; }
  new IntersectionObserver(es => { es[0].isIntersecting && !document.hidden ? start() : stop(); }, { threshold: 0.1 }).observe(cv);
  document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });

  const map = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", Space: "jump", ArrowUp: "jump", KeyW: "jump" };
  function press(k, down) {
    if (k === "jump" && down && !keys.jump) P.buffer = BUFFER;
    keys[k] = down;
  }
  cv.addEventListener("keydown", e => { const k = map[e.code]; if (k) { e.preventDefault(); press(k, true); } });
  cv.addEventListener("keyup", e => { const k = map[e.code]; if (k) { e.preventDefault(); press(k, false); } });
  cv.addEventListener("focus", () => { focused = true; });
  cv.addEventListener("blur", () => { focused = false; keys.left = keys.right = keys.jump = false; });
  cv.addEventListener("pointerdown", () => cv.focus());

  [["#b-left", "left"], ["#b-right", "right"], ["#b-jump", "jump"]].forEach(([sel, k]) => {
    const b = $(sel);
    b.addEventListener("pointerdown", e => { e.preventDefault(); press(k, true); });
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, () => press(k, false)));
  });

  resize(); readPalette(); hud();
})();
</script>
